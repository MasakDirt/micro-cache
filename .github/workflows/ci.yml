name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: micro_cache
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d micro_cache"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The tests use this database instead of starting a testcontainer.
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/micro_cache
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy api cli core db utils tests migrations
      - run: uv run pytest -W error

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build .
